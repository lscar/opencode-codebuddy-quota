name: Publish to npmjs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # 生成 OIDC token，npm trusted publishing 免 token / 免 2FA

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # 发布构建禁用缓存

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ($TAG) != package.json version ($PKG)" >&2
            exit 1
          fi

      - name: Check (typecheck + tests)
        run: bun run check

      - name: Build GUI bundle
        run: bun run build:gui

      - name: Publish (OIDC trusted publishing, no token / no 2FA)
        run: npm publish --provenance --access public
